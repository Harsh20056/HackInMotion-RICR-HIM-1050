name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - name: Lint
        run: npm run lint
        working-directory: backend
      - name: Typecheck + build
        run: npm run build
        working-directory: backend
      # Tests need a Postgres+PostGIS instance via TEST_DATABASE_URL. Left out
      # here rather than pretending to run them against nothing — wire the
      # secret in and add `npm test` when a CI database exists.

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Test
        run: npm run test
        working-directory: frontend
      # `npm run build` also prerenders, which needs a Chrome binary. Run the
      # plain Vite build here and leave prerendering to the deploy step.
      - name: Build
        run: npx vite build
        working-directory: frontend
